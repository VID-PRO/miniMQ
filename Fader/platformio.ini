; PlatformIO project for the DIY MagicQ Mini Connect Wing
; Target: Raspberry Pi Pico (RP2040), earlephilhower Arduino core,
; native TinyUSB HID (USB keyboard). Pattern proven in chamsys-encoder.

[env:pico]
platform = raspberrypi
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0

; chain+ resolves transitive includes (e.g. tusb-hid.h used by HID_Keyboard)
lib_ldf_mode = chain+

monitor_speed = 115200

; Upload via RP2040 USB bootloader (picotool). For UF2 drag-and-drop
; use: upload_protocol = picotool (flash is handled by BOOTSEL)
upload_protocol = picotool