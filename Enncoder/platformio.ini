[platformio]
default_envs = pico-left

[env:pico-left]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; 64 KB LittleFS-Partition - OHNE das schlaegt LittleFS.begin() fehl und
; die Kalibrierwerte (ecal.bin) koennen nicht gespeichert werden.
board_build.filesystem_size = 64
lib_ldf_mode = chain+
lib_deps =
    lostcaggy/CaggyRotary@^1.0.0
monitor_speed = 115200
; linker Baustein: On-Screen-Encoder 1..4 (Default-Ziele, Kalibrierung ueberschreibt)
build_flags =
    -DENC_SIDE=0

[env:pico-right]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64
lib_ldf_mode = chain+
lib_deps =
    lostcaggy/CaggyRotary@^1.0.0
monitor_speed = 115200
; rechter Baustein: On-Screen-Encoder 5..8 (Default-Ziele, Kalibrierung ueberschreibt)
build_flags =
    -DENC_SIDE=1