; ------------------------------------------------------------------
; DMX-Router: 4 -> 16 DMX/RDM matrix splitter on a Raspberry Pi Pico
;
; Standalone firmware; pin map and wiring are documented in README.md
; (section "Pin-Belegung").
;
;   - 4 DMX/RDM inputs  (PIO UART receivers)
;   - 16 DMX outputs    (2 x 8 pins, PIO bit-plane transmitter + DMA)
;   - 16 RDM return     channels via two 74HC151 multiplexers
;   - SSD1306 OLED + PCF8574 key expander on I2C (optional hardware)
;   - routing/HTP merge configuration in LittleFS
;
; Arduino-Pico core (earlephilhower) is used for the PIO/DMA HAL.
; ------------------------------------------------------------------

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; 64 KB LittleFS partition for /router.cfg (config must survive reboots).
board_build.filesystem_size = 64k
lib_ldf_mode = chain+
monitor_speed = 115200

; Upload via the native 1200-bps CDC touch, exactly like the other
; projects in this repository. The first flash still needs BOOTSEL.
upload_protocol = picotool
; Pin the port when more than one USB serial device is attached.
; upload_port = /dev/cu.usbmodem14401

; The firmware is entirely self-contained (PIO programs + a small
; SSD1306 driver), so no external libraries are required.
