;
; miniMQ root workspace project.
;
; Exposes the three PlatformIO projects (Fader, Enncoder, ArtNet-USB) as
; environments, so the PlatformIO tab in VSCode shows Build/Upload/Clean
; tasks for every project from the repo root.
;
; This PlatformIO core only reads directory options (src_dir, build_dir, ...)
; from the [platformio] section, not per environment. A pre-build script
; (scripts/redirect_env.py) therefore relocates each env's source/lib/build
; dirs into its project folder at build time. The subfolders keep working
; standalone (`pio run -d Fader`) and build artifacts stay in <project>/.pio.
; ------------------------------------------------------------------

[platformio]
default_envs =
    fader
    encoder
    artnet

[env:fader]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
lib_ldf_mode = chain+
monitor_speed = 115200
upload_protocol = picotool
extra_scripts =
    pre:scripts/redirect_env.py

[env:encoder]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
lib_ldf_mode = chain+
monitor_speed = 115200
lib_deps =
    lostcaggy/CaggyRotary@^1.0.0
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
extra_scripts =
    pre:scripts/redirect_env.py

[env:artnet]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/libraries/WiFi/src
extra_scripts =
    pre:scripts/redirect_env.py