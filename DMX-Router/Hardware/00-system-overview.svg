<text x="72.0" y="963.0" font-size="8.0" class="note" text-anchor="start">Alle Platinen teilen GND und 3,3 V. Die DMX-Busseiten sind je Kanal über ISO1410DWR und B0505S galvanisch getrennt.</text>
<text x="72.0" y="976.0" font-size="8.0" class="note" text-anchor="start">J1..J5 sind 2×8-Wannenstecker mit 2,54 mm Raster; Flachbandkabel kurz halten und abwechselnd GND führen.</text>
<text x="72.0" y="989.0" font-size="8.0" class="note" text-anchor="start">Eingang: 120 Ω fest am Router (Strangende). Ausgang: 560 Ω Fail-Safe-Bias je Port, 120 Ω nur am letzten Gerät des Strangs.</text>
<text x="72.0" y="1002.0" font-size="8.0" class="note" text-anchor="start">RDM ist best-effort: ein gemeinsamer DIR_OUT und ein Rückkanal je Ausgang; Discovery findet pro Zweig nur den ersten Responder.</text>
<text x="72.0" y="1015.0" font-size="8.0" class="note" text-anchor="start">Bestückung: 1 × Eingangsplatine, 4 × Ausgangsplatine, 1 × Controllerplatine. 5-V-Netzteil mindestens 5 A.</text>
</svg>
