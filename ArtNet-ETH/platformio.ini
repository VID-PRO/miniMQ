[platformio]
default_envs = w5100s

; ------------------------------------------------------------------
; ArtNet-ETH: 4x DMX512/RDM node with a real Ethernet port.
;
; Hardware: WIZnet W5100S-EVB-Pico (RP2040 + on-board W5100S + RJ45),
; 4x MAX485 RS485 transceivers (schematic label: MAX3485EPA) on 3-pin
; female XLR sockets, SSD1306 OLED and four keys on free GPIOs.  Each
; port can be switched between output and input in software; input mode
; needs a male-male adapter because the sockets are output-gender.
;
; The on-board W5100S takes GP16..GP21 (SPI0 + RST/INT) and is therefore
; NOT available for keys.  See README.md, section "Pin-Belegung".
;
; ONE firmware contains both transports.  At boot the node checks
; whether a USB data host enumerates the CDC+NCM composite device:
;   - host present  -> Ethernet over USB (CDC-NCM)
;   - power only    -> on-board W5100S + RJ45
; The choice is logged on the serial console and shown in the web UI
; and on the OLED.  Both transports share the same DMX/RDM/UI code.
; ------------------------------------------------------------------

[env:w5100s]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = wiznet_5100s_evb_pico
framework = arduino
board_build.core = earlephilhower

lib_ldf_mode = chain+
monitor_speed = 115200

; Native USB CDC is used for logs and flashing.
upload_protocol = picotool

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/libraries/WiFi/src
