[platformio]
default_envs = pico

; ------------------------------------------------------------------
; Art-Net over USB (CDC-NCM) to 4x DMX512 on the Raspberry Pi Pico.
; Uses the Arduino-Pico core (earlephilhower) which ships:
;   - NCMEthernetlwIP : USB CDC-NCM "Ethernet over USB" + lwIP
;   - WiFiUDP         : lwIP UDP socket (Art-Net)
; RP2040 has no built-in Wi-Fi/ETH -- the USB link is the network IF.
; ------------------------------------------------------------------

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/libraries/WiFi/src
