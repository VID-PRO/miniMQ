;
; miniMQ root workspace project.
;
; Exposes the three PlatformIO projects (Wing, Enncoder, ArtNet-USB) as
; environments, so the PlatformIO tab in VSCode shows Build/Upload/Clean
; tasks for every project from the repo root.
;
; This PlatformIO core only reads directory options (src_dir, build_dir, ...)
; from the [platformio] section, not per environment. A pre-build script
; (scripts/redirect_env.py) therefore relocates each env's source/lib/build
; dirs into its project folder at build time. The subfolders keep working
; standalone (`pio run -d Wing`) and build artifacts stay in <project>/.pio.
; ------------------------------------------------------------------

[platformio]
default_envs =
    wing
    encoder
    artnet

[env:wing]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; 64 KB LittleFS fuer /fcal.bin bzw. /ecal.bin (muss mit dem
; jeweiligen Projekt-verzeichnis-Build uebereinstimmen)
board_build.filesystem_size = 64
lib_ldf_mode = chain+
monitor_speed = 115200
; Upload ohne BOOTSEL: die laufende Firmware bietet den nativen 1200-bps-CDC-
; Touch an (Core-SerialUSB + `use_1200bps_touch` im rpipico-Board) -> der
; Uploader rebootet das laufende Geraet selbst in den BOOTSEL-Modus.
; -DENABLE_PICOTOOL_USB darf NICHT gesetzt werden: es liess die USB-Enumeration
; auf macOS fehlschlagen (kein /dev/cu.usb*, keine HID-Tastatur).
upload_protocol = picotool
; Upload-Port festnageln (sonst trifft der 1200-bps-Touch bei mehreren
; Serial-Geraeten den falschen Port). usbmodem-Name kann nach dem Umstecken
; wechseln: `pio device list`, dann hier anpassen.
upload_port = /dev/cu.usbmodem14401
extra_scripts =
    pre:scripts/redirect_env.py

[env:encoder]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; 64 KB LittleFS fuer /fcal.bin bzw. /ecal.bin
board_build.filesystem_size = 64
lib_ldf_mode = chain+
monitor_speed = 115200
lib_deps =
    lostcaggy/CaggyRotary@^1.0.0
; linker Baustein (Standard). Rechte Seite: -DENC_SIDE=1 bauen/flashen.
; Beide Bausteine verwenden das identische Pinout; die Kalibrierung (ecal.bin)
; ist pro RP2040 getrennt und ueberschreibt die Default-Ziele.
build_flags =
    -DENC_SIDE=0
extra_scripts =
    pre:scripts/redirect_env.py

[env:artnet]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -I$PROJECT_PACKAGES_DIR/framework-arduinopico/libraries/WiFi/src
extra_scripts =
    pre:scripts/redirect_env.py