; PlatformIO project for the DIY MagicQ Mini Connect Wing
; Target: Raspberry Pi Pico (RP2040), earlephilhower Arduino core,
; native TinyUSB HID (USB keyboard). Pattern proven in chamsys-encoder.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; 64 KB LittleFS-Partition - OHNE das schlaegt LittleFS.begin() fehl und
; Kalibrierwerte (fcal.bin / ecal.bin) koennen nicht gespeichert werden.
board_build.filesystem_size = 64k

; chain+ resolves transitive includes (e.g. tusb-hid.h used by HID_Keyboard)
lib_ldf_mode = chain+

monitor_speed = 115200

; Upload ohne BOOTSEL: die laufende Firmware bietet den nativen 1200-bps-CDC-
; Touch an (Core-SerialUSB + `use_1200bps_touch` im rpipico-Board) -> der
; Uploader rebootet das laufende Geraet selbst in den BOOTSEL-Modus.
; -DENABLE_PICOTOOL_USB darf NICHT gesetzt werden: es liess die USB-Enumeration
; auf macOS fehlschlagen (kein /dev/cu.usb*, keine HID-Tastatur).
upload_protocol = picotool

; Port festnageln, damit die Auto-Erkennung bei mehreren
; Serial-Geraeten (z. B. Bluetooth "CT221B-R2RF") nicht den falschen Port fuer
; den 1200-bps-Touch waehlt. usbmodem-Name kann nach dem Umstecken wechseln;
; `pio device list` zeigt ihn an, dann hier bzw. per
; `pio run -t upload --upload-port /dev/cu.usbmodemXXXX` anpassen.
upload_port = /dev/cu.usbmodem14401